name: Сборка только ваших каналов

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install requests
      run: pip install requests
    - name: Build playlist
      run: python iptv_builder.py
    - name: Save changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u
        git diff --staged --quiet || git commit -m "Обновление $(date '+%Y-%m-%d %H:%M')"
        git push
